name: Practical supplies validation and previews
on:
  push:
    branches: [codex/practical-supplies]
    paths:
      - game/core/supplies.gd
      - game/core/progress.gd
      - game/core/recruitment.gd
      - game/*screen.gd
      - game/main.gd
      - tests/supplies*.gd
      - tools/check_supplies.py
      - tools/validate_supply_art.py
      - art/supplies/*.png
      - .github/workflows/supplies.yml
permissions:
  contents: write
concurrency:
  group: practical-supplies-preview
  cancel-in-progress: false
jobs:
  godot:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot4.6.3 and display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libasound2t64
          curl -fL --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Verify original art and import
        run: |
          python3 tools/validate_supply_art.py
          python3 tools/build_icon_manifest.py
          mkdir -p work/supplies-check
          godot --headless --editor --path . --import > work/supplies-check/import.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          text=Path('work/supplies-check/import.log').read_text()
          assert 'SCRIPT ERROR' not in text and 'Parse Error' not in text,text
          PY
      - name: Validate inventory, save migration, battles and UI
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          timeout 15s godot --headless --path . --script tests/supplies.gd
          xvfb-run -a -s "-screen 0 1080x1080x24" python3 tools/check_supplies.py
      - name: Publish verified evidence on working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/icons/manifest.json art/icons/provenance.json art/supplies/provenance.json docs/previews/supplies game/core/supplies.gd.uid game/supplies_screen.gd.uid tests/supplies.gd.uid tests/supplies_ui.gd.uid
          if ! git diff --cached --quiet; then
            git commit -m "docs: verified supplies previews and source provenance"
            git push origin HEAD:codex/practical-supplies
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: practical-supplies-checks
          path: |
            work/supplies-check/
            docs/previews/supplies/
          retention-days: 7
