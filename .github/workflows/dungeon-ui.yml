name: Dungeon UI validation and previews
on:
  push:
    branches: [codex/dungeon-world-ui]
    paths:
      - game/dungeon*.gd
      - game/data/dungeon_world.json
      - game/main.gd
      - tests/dungeon_world.gd
      - art/dungeons/*.png
      - art/dungeons/manifest.json
      - tools/validate_dungeon_art.py
      - tools/check_dungeon_ui.py
      - .github/workflows/dungeon-ui.yml
permissions:
  contents: write
concurrency:
  group: dungeon-ui-preview
  cancel-in-progress: false
jobs:
  godot:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install display and Godot 4.6.3
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libasound2t64
          curl -fL --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Check original art and import project
        run: |
          python3 tools/validate_dungeon_art.py
          mkdir -p work/dungeon-check
          godot --headless --editor --path . --import > work/dungeon-check/import.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          text=Path('work/dungeon-check/import.log').read_text()
          assert 'SCRIPT ERROR' not in text and 'Parse Error' not in text,text
          PY
      - name: Test real rendering and touch navigation
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1080x1080x24" python3 tools/check_dungeon_ui.py
      - name: Publish only verified preview files on the working branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art/dungeons/provenance.json docs/previews/dungeons game/dungeon_world.gd.uid game/dungeon_screen.gd.uid tests/dungeon_world.gd.uid
          if ! git diff --cached --quiet; then
            git commit -m "docs: verified dungeon UI previews and original art provenance"
            git push origin HEAD:codex/dungeon-world-ui
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dungeon-ui-checks
          path: |
            work/dungeon-check/
            docs/previews/dungeons/
          retention-days: 7
