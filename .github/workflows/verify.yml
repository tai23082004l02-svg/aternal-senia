name: Project verification
on:
  push:
    branches: [main, codex/repository-cleanup]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: project-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and verification dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libasound2t64 ffmpeg python3-numpy
          curl -fL --retry 2 https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo install /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
      - name: Check tracked files, links and Python syntax
        run: |
          /usr/bin/python3 tools/verify_repo.py
          /usr/bin/python3 -m compileall -q game tools tests
          sh -n tools/export_android.sh
      - name: Import project
        run: |
          godot --headless --editor --path . --import > work/checks/import.log 2>&1
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          text=Path('work/checks/import.log').read_text()
          assert 'SCRIPT ERROR' not in text and 'Parse Error' not in text,text
          PY
      - name: Check runtime-only Android export
        run: |
          sh tools/export_android.sh /tmp/first-light-export
          test -f /tmp/first-light-export/project.godot
          test -d /tmp/first-light-export/game
          test -d /tmp/first-light-export/art
          test ! -e /tmp/first-light-export/docs
          test ! -e /tmp/first-light-export/.git
          test ! -e /tmp/first-light-export/tests
          godot --headless --editor --path /tmp/first-light-export --import > work/checks/export-import.log 2>&1
          /usr/bin/python3 - <<'PY'
          from pathlib import Path
          text=Path('work/checks/export-import.log').read_text()
          assert 'SCRIPT ERROR' not in text and 'Parse Error' not in text,text
          PY
      - name: Run logic, UI and mixer suites
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1080x1080x24" /usr/bin/python3 tools/check_project.py
      - name: Verify ElevenLabs sources and mixer recording
        run: /usr/bin/python3 tests/validate_audio.py --capture work/checks/audio_capture/audio-runtime.wav
      - name: Ensure checks did not modify tracked source
        run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: project-verification-${{ github.run_id }}
          path: work/checks/
          retention-days: 7
